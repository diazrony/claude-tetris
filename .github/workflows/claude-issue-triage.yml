name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh label list:*),Bash(gh label create:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"'
          prompt: |
            Estás haciendo triage automático de un issue en el repo ${{ github.repository }}.
            Issue número: ${{ github.event.issue.number }}

            ## Contexto del proyecto

            Es "Classic Tetris", un juego de Tetris en JavaScript vanilla + HTML5 Canvas + CSS,
            sin dependencias, sin build, sin package.json ni suite de tests. Tres archivos:

            - `index.html` — DOM: `<canvas id="board">` (300x600, grid 10x20 a 30px/celda),
              `<canvas id="next-canvas">` para la pieza siguiente, HUD de score/lines/level,
              overlay de pausa/game-over.
            - `style.css` — tema retro/arcade oscuro.
            - `game.js` — toda la lógica del juego, un solo archivo, scope global, estado
              mutable top-level (`board`, `current`, `next`, `score`, `lines`, `level`,
              `paused`, `gameOver`, `dropInterval`, etc.), sin clases ni módulos.

            Mecánicas clave en `game.js`:
            - Board: matriz `ROWS x COLS`, celda `0` (vacía) o `1-7` (índice de color en `COLORS`).
            - Piezas: matrices cuadradas hardcodeadas en `PIECES`. Rotación vía `rotateCW`
              (transponer + invertir), no hay estados de rotación precalculados.
            - Colisión: `collide(shape, ox, oy)` revisa límites y solapamiento contra `board`.
            - Wall kicks: `tryRotate()` prueba offsets `[0, -1, 1, -2, 2]` tras rotar y se queda
              con el primero que no colisiona.
            - Loop: `loop(ts)` con `requestAnimationFrame`, acumula `dt` en `dropAccum`, baja
              una fila cuando supera `dropInterval`.
            - Limpieza de líneas: `clearLines()` recorre de abajo hacia arriba, hace `splice`
              de filas completas y `unshift` de filas vacías arriba.
            - Puntuación: `LINE_SCORES = [0, 100, 300, 500, 800]` x `level`; hard drop = 2
              pts/celda, soft drop = 1 pt/fila.
            - Nivel: `level = floor(lines / 10) + 1`; `dropInterval = max(100, 1000 - (level-1)*90)`.
            - Ghost piece: `ghostY()` proyecta la pieza actual hacia abajo hasta su fila de
              aterrizaje; se dibuja con `globalAlpha = 0.2`.
            - Input: un solo listener `keydown` (flechas, `X` rota, `Space` hard drop, `P` pausa).

            ## Objetivo

            Analizar el issue, aplicarle las labels apropiadas y publicar (o actualizar) un
            comentario con un diagnóstico técnico que sirva como base para implementar la
            solución después.

            ## Pasos a seguir

            1. Lee el issue completo:
               `gh issue view ${{ github.event.issue.number }} --json title,body,labels,author`

            2. Investiga el código real del repo con Read/Grep/Glob sobre `game.js`,
               `index.html` y `style.css` para localizar las funciones y líneas implicadas
               en lo que reporta o pide el issue. Toda referencia a código en tu diagnóstico
               debe ser `archivo:línea` real, verificada por ti — nunca inventada.

            3. Gestiona las labels:
               - Lista las existentes: `gh label list`.
               - Reutiliza las que encajen (por ejemplo `bug`, `enhancement`, `documentation`,
                 `question`, `invalid`, `duplicate`, `good first issue`, `help wanted`).
               - Si hace falta una label que no existe, créala tú mismo:
                 `gh label create "<nombre>" --color <hex-sin-#> --description "<desc>"`
                 (si falla porque ya existe, ignora el error y continúa).
               - Tienes libertad para crear las labels que consideres necesarias, pero
                 mantén una taxonomía consistente usando prefijos como `area:`, `priority:`,
                 `status:` en vez de inventar nombres sueltos cada vez.
               - Aplica las labels elegidas:
                 `gh issue edit ${{ github.event.issue.number }} --add-label "a,b,c"`.
               - Si el issue es claramente spam, duplicado o inválido, aplica la label
                 correspondiente (`invalid` / `duplicate`) y salta al paso 5 con un
                 diagnóstico de una sola línea en vez del informe completo.

            4. Redacta el diagnóstico en un archivo temporal (para evitar problemas de
               escaping de markdown) usando Markdown enriquecido que GitHub renderiza con
               colores e iconos: tablas, listas de tareas, bloques `<details>` colapsables y,
               sobre todo, los **alerts nativos de GitHub** (`> [!NOTE]`, `> [!TIP]`,
               `> [!IMPORTANT]`, `> [!WARNING]`, `> [!CAUTION]`) — cada uno se renderiza con su
               propio color e icono, así que elígelos por significado, no al azar:
               - `NOTE` → resumen / información neutral.
               - `TIP` → sugerencia u observación positiva.
               - `IMPORTANT` → información faltante o algo que el autor debe saber.
               - `WARNING` → causa raíz no verificada (hipótesis).
               - `CAUTION` → riesgos, efectos colaterales o issue inválido/spam.

               Sigue esta estructura exacta, empezando siempre por el marcador HTML en la
               primera línea (va SOLO en esa línea, nunca dentro de un alert ni de una tabla):

               ```
               <!-- claude-triage -->
               ## 🔍 Diagnóstico automático

               > [!NOTE]
               > **Resumen:** 1-2 frases reformulando lo que pide o reporta el issue.

               ### 🏷️ Clasificación

               | Campo | Valor |
               |---|---|
               | **Tipo** | {emoji según tipo} {bug / mejora / duda / documentación / inválido} |
               | **Labels aplicadas** | `label1`, `label2`, ... |

               Emoji por tipo: 🐛 bug · ✨ mejora · ❔ duda · 📚 documentación · 🚫 inválido.

               <details>
               <summary>📋 Justificación de cada label</summary>

               - `label1` — por qué aplica.
               - `label2` — por qué aplica.

               </details>

               ### 🗺️ Zona del código

               | Archivo | Línea | Función / contexto |
               |---|---|---|
               | `game.js` | `123` | `nombreFuncion()` |

               (Toda referencia debe ser `archivo:línea` real, verificada leyendo el código —
               nunca inventada. Si no aplica ninguna zona de código, omite esta sección.)

               ### 🧬 Causa raíz probable

               Solo para bugs. Texto directo si la verificaste leyendo el código; si es una
               hipótesis sin confirmar, envuélvela en:

               > [!WARNING]
               > Hipótesis sin verificar en runtime: ...

               ### 🔁 Reproducción

               1. Paso concreto.
               2. Paso concreto.

               Si el issue no da datos suficientes, añade:

               > [!IMPORTANT]
               > Faltan datos para reproducir: ...

               ### ✅ Criterios de aceptación

               - [ ] Criterio verificable 1.
               - [ ] Criterio verificable 2.

               ### 🛠️ Esbozo de solución

               <details>
               <summary>Ver propuesta técnica</summary>

               Qué cambiar y dónde, sin escribir el parche completo.

               </details>

               ### ⚠️ Riesgos / efectos colaterales

               > [!CAUTION]
               > Por ejemplo, tocar `BLOCK`/`COLS`/`ROWS` obliga a ajustar el `<canvas>` en
               > `index.html`.

               ### ❓ Información faltante

               > [!IMPORTANT]
               > Preguntas concretas al autor del issue (omite esta sección si no aplica).

               ---
               <sub>🤖 Generado automáticamente por Claude — este comentario se actualiza en
               cada edición del issue.</sub>
               ```

               Notas de formato:
               - Omite las secciones que no apliquen (por ejemplo "Causa raíz probable" y
                 "Reproducción" en un issue de tipo documentación), pero conserva siempre el
                 marcador inicial, el título `## 🔍 Diagnóstico automático`, el resumen en
                 `[!NOTE]` y el pie de página final.
               - No anides un alert dentro de una tabla ni de un `<details>`; GitHub no los
                 renderiza bien en esos contextos.
               - Si el issue es spam, duplicado o inválido (paso 3), usa esta versión corta
                 en vez del informe completo, manteniendo el marcador:

                 ```
                 <!-- claude-triage -->
                 ## 🔍 Diagnóstico automático

                 > [!CAUTION]
                 > **Inválido/duplicado:** razón en una frase. Label aplicada: `label`.
                 ```

            5. Publica el diagnóstico como comentario único y actualizable:
               - Busca si ya existe un comentario tuyo anterior con el marcador:
                 `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[] | select(.body | contains("<!-- claude-triage -->")) | .id'`
               - Si existe un id, actualízalo (no crees uno nuevo):
                 `gh api --method PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=@<archivo-temporal>`
               - Si no existe, crea uno nuevo:
                 `gh issue comment ${{ github.event.issue.number }} --body-file <archivo-temporal>`

            ## Reglas importantes

            - NUNCA escribas la palabra "@claude" en el comentario ni en las labels: dispararía
              en cascada el workflow que responde a menciones.
            - No modifiques el título ni el cuerpo del issue.
            - No toques archivos del repositorio, no crees ramas ni abras pull requests. Tu
              trabajo termina en labels + un comentario de diagnóstico.
